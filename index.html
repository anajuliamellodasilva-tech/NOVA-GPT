<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NovaGPT</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background: linear-gradient(180deg, #f5f5f5, #e9ecef);
      font-family: Arial, sans-serif;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* APP CONTAINER */
    .app{
      width:420px;
      height:90vh;
      background:white;
      border-radius:20px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 10px 25px rgba(0,0,0,0.15);
      position:relative;
    }

    /* TOPBAR */
    .topbar{
      background: linear-gradient(90deg, #00c851, #00a844);
      color:white;
      padding:14px 15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .topbar h1{
      font-size:20px;
      font-weight:bold;
      margin:0;
    }

    #provider{
      width:140px;
      border-radius:8px;
    }

    /* CHAT */
    #chat{
      flex:1;
      padding:15px;
      overflow-y:auto;
      background:#f8f9fa;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .msg{
      padding:10px 14px;
      border-radius:18px;
      max-width:75%;
      word-wrap:break-word;
      font-size:14px;
      animation:fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(5px);}
      to{opacity:1; transform:translateY(0);}
    }

    .user{
      background:#d1ffd6;
      align-self:flex-end;
      border-bottom-right-radius:5px;
    }

    .bot{
      background:#ffffff;
      align-self:flex-start;
      border:1px solid #eee;
      border-bottom-left-radius:5px;
    }

    /* INPUT AREA */
    .input-area{
      padding:10px;
      border-top:1px solid #eee;
      background:white;
    }

    #input{
      border-radius:12px !important;
    }

    /* BOTÃO ENVIAR */
    .btn-send{
      border-radius:12px;
    }

    /* VOZ */
    #btn-voz{
      position:absolute;
      bottom:85px;
      right:15px;

      width:55px;
      height:55px;

      border-radius:50%;
      border:none;

      background:#6c5ce7;
      color:white;

      font-size:20px;

      box-shadow:0 8px 20px rgba(0,0,0,0.2);
      cursor:pointer;

      transition:0.2s;
    }

    #btn-voz:hover{
      transform:scale(1.05);
      background:#5946d2;
    }

    /* STATUS */
    #status{
      font-size:12px;
      opacity:0.7;
      text-align:center;
      padding:4px;
    }

    /* MOBILE */
    @media(max-width:500px){
      .app{
        width:100%;
        height:100vh;
        border-radius:0;
      }
    }

  </style>

</head>

<body>

  <div class="app">

    <!-- TOP -->
    <div class="topbar">

      <h1>🤖 NovaGPT</h1>

      <select id="provider" class="form-select">
        <option value="azure">ChatGPT</option>
        <option value="gemini">Gemini</option>
      </select>

    </div>

    <!-- CHAT -->
    <div id="chat">

      <div class="msg bot">
        Olá 👋<br>
        Posso falar por texto ou voz.
      </div>

    </div>

    <!-- STATUS -->
    <div id="status">
      🎤 Pronto
    </div>

    <!-- BOTÃO VOZ -->
    <button id="btn-voz" onclick="ativarVoz()">
      🎤
    </button>

    <!-- INPUT -->
    <div class="input-area">

      <div class="input-group">

        <input type="text" id="input" class="form-control" placeholder="Digite sua mensagem...">

        <button class="btn btn-success btn-send" onclick="enviar()">
          ➤
        </button>

      </div>

    </div>

  </div>

  <script src="./script.js"></script>

</body>

</html>
